name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check]
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    env:
      TAG: ${{ github.ref_name }}
      TARGET: ${{ matrix.target }}
      # secrets context cannot be used in `if:` conditionals (the parser
      # rejects the expression and the whole workflow fails to start), so
      # presence flags are computed here in job env and checked via
      # `if: env.*` / in-run guards instead.
      HAS_CERT: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build release binaries
        run: |
          cargo build --release --target "$TARGET"
          mkdir -p "dist/$TARGET"
          cp "target/$TARGET/release/pengwm" "dist/$TARGET/"
          cp "target/$TARGET/release/pengwm-menubar" "dist/$TARGET/"
          cp LICENSE "dist/$TARGET/" 2>/dev/null || true
          ls -la "dist/$TARGET/"

      # Developer-ID signing when secrets are present; ad-hoc fallback otherwise.
      # Required secrets for real signing (see docs/distribution.md):
      #   APPLE_CERTIFICATE_P12 (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
      #   APPLE_DEVELOPER_IDENTITY (e.g. "Developer ID Application: Name (TEAMID)"),
      #   APPLE_TEAM_ID.
      # A real Developer ID also makes TCC grants survive updates (the DR
      # binds to the certificate, not the per-build cdhash) — ADR-0001
      # records the accepted re-grant-per-update cost while ad-hoc.
      - name: Import Developer ID certificate (if configured)
        if: env.HAS_CERT == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Codesign binaries
        env:
          IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
        run: |
          set -euo pipefail
          DIR="dist/$TARGET"
          sign_all() {
            for bin in pengwm pengwm-menubar; do
              "$@" "$DIR/$bin"
            done
          }
          if [[ -n "${IDENTITY:-}" ]]; then
            echo "Signing with Developer ID: $IDENTITY"
            sign_all codesign --force --options runtime --timestamp -s "$IDENTITY"
          else
            # Impossible to miss: ad-hoc means every update re-prompts.
            echo '⚠ Release is ad-hoc signed. Users will re-prompt Accessibility every update. Set APPLE_* secrets — see docs/distribution.md "Signing".'
            sign_all codesign --force -s -
          fi
          # Hard gate: a broken/invalid signature must fail the build here,
          # not ship.
          sign_all codesign --verify --strict --verbose=2
          if [[ -n "${IDENTITY:-}" ]]; then
            # With a Developer ID configured the result must actually be a
            # Developer ID signature (guards a silent ad-hoc fallback).
            if ! codesign -dvv "$DIR/pengwm" 2>&1 | grep -q "Developer ID Application"; then
              echo "::error::Expected Developer ID signature on $DIR/pengwm but none found"
              exit 1
            fi
          fi
          codesign -dv --verbose=4 "$DIR/pengwm" 2>&1 | head -20 || true

      - name: Package artifacts
        run: |
          set -euo pipefail
          # Flat tarball: the one install artifact (install.sh, formula).
          # -C dist/$TARGET + `.` keeps the archive root at the binaries,
          # which is what install.sh and Formula/pengwm.rb unpack.
          tar czf "pengwm-${TAG}-${TARGET}.tar.gz" -C "dist/$TARGET" .
          shasum -a 256 "pengwm-${TAG}-${TARGET}.tar.gz" > "pengwm-${TAG}-${TARGET}.tar.gz.sha256"
          ls -la pengwm-*

      - name: Assert artifact + checksum sidecar exist
        run: |
          set -euo pipefail
          f="pengwm-${TAG}-${TARGET}.tar.gz"
          if [[ ! -f "$f" ]]; then
            echo "::error::Missing release artifact: $f"
            exit 1
          fi
          if [[ ! -f "$f.sha256" ]]; then
            echo "::error::Missing checksum sidecar: $f.sha256"
            exit 1
          fi
          # The sidecar must actually match — a stale/typo'd hash would
          # break install.sh and the formula.
          shasum -a 256 -c "$f.sha256"

      - name: Record signing mode in job summary
        env:
          IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -n "${IDENTITY:-}" ]]; then
            sig="Developer ID ($IDENTITY)"
          else
            {
              echo "⚠ Release is ad-hoc signed. Users will re-prompt Accessibility every update. Set APPLE_* secrets — see docs/distribution.md \"Signing\"."
            } | tee /dev/stderr
            sig="ad-hoc"
          fi
          {
            echo "### PengWM release — signing mode"
            echo ""
            echo "| Target | Signing |"
            echo "|---|---|"
            echo "| \`$TARGET\` | $sig |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          # One artifact style: the flat tarball + its sidecar. (ADR-0001
          # retired the pengwm-app-* bundle artifacts and the notarytool
          # zips. The old non-overlapping-glob rule is moot now but kept
          # correct: pengwm-v*.tar.gz matches nothing else.)
          files: |
            pengwm-v*.tar.gz
            pengwm-v*.tar.gz.sha256
          generate_release_notes: true
