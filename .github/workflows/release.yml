name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build release binaries
        run: |
          cargo build --release
          mkdir -p dist

      - name: Ad-hoc codesign (required for macOS AX permissions)
        run: |
          codesign --force --deep -s - target/release/pengwm-daemon
          codesign --force --deep -s - target/release/pengwm-cli

      - name: Package binaries
        run: |
          cp target/release/pengwm-daemon dist/
          cp target/release/pengwm-cli dist/
          cd dist && tar czf ../pengwm-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz .

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: pengwm-*.tar.gz
          generate_release_notes: true
