[package]
name = "pengwm-menubar"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pengwm-menubar"
path = "src/main.rs"

[dependencies]
pengwm-core = { path = "../pengwm-core" }
serde_json = "1"
log = "0.4"
env_logger = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSStatusItem", "NSStatusBar", "NSStatusBarButton", "NSMenu", "NSMenuItem", "NSImage", "NSButton", "NSControl", "NSResponder", "NSView", "objc2-core-foundation"] }
objc2-core-foundation = "0.3"
