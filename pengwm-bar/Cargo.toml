[package]
name = "pengwm-bar"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pengwm-bar"
path = "src/main.rs"

[dependencies]
pengwm-core = { path = "../pengwm-core" }
eframe = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
log = "0.4"
env_logger = "0.10"
anyhow = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication"] }
